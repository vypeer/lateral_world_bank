[project]
name = "wbpipe"
version = "0.1.0"
description = "Configuration-driven World Bank indicator pipeline (API -> DuckDB -> reporting outputs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "pytz>=2024.1",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.scripts]
wbpipe = "wbpipe.cli:main"

[project.optional-dependencies]
app = [
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.3.3.260113",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pytz>=2026.5.0.20261006",
    "types-pyyaml",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wbpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/CSS templates (long lines) with intentional typographic characters (– ×).
"src/wbpipe/dashboard.py" = ["E501", "RUF001"]
"src/wbpipe/app.py" = ["RUF001"]
"tests/test_dashboard.py" = ["RUF001"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scripts"]
