# Pipeline configuration. Adding a country or indicator is a one-line change here;
# no pipeline code needs to be copied or edited.

api:
  base_url: https://api.worldbank.org/v2
  per_page: 1000          # API maximum is large; tests use fixtures captured with per_page=50
  timeout_seconds: 30
  max_retries: 5
  backoff_seconds: 1.0    # exponential: 1, 2, 4, ... (plus jitter)

ingest:
  # Before a full fetch, probe the API cheaply (country list hash, and each indicator's
  # lastupdated and row count) and skip the run when nothing changed since the last successful
  # one with the same scope. `wbpipe run --force` always fetches.
  skip_if_unchanged: true

years:
  start: 2018
  end: 2024

# Countries in scope: "all" = every economy the World Bank API lists (217 today; regional and
# income-group aggregates are excluded), or an explicit list of ISO3 codes.
countries: all

# The brief's countries. Dashboards show these by default, and the latest-year comparison uses
# the latest year in which all of them have a value. Must be within `countries`.
focus_countries:
  - BRA
  - CAN
  - DEU
  - GBR
  - IND
  - JPN
  - MEX
  - USA
  - ZAF

# valid_min / valid_max (optional, inclusive) bound plausible values; checked as a FAIL.
# aggregation (optional, default mean) says how to combine countries, e.g. by income group:
#   mean | sum | {method: ratio, numerator, denominator} | {method: weighted_mean, weight}
indicators:
  - code: SP.POP.TOTL
    short_name: population
    valid_min: 1
    aggregation: sum
  - code: NY.GDP.MKTP.CD
    short_name: gdp_usd
    valid_min: 1
    aggregation: sum
  - code: NY.GDP.PCAP.CD
    short_name: gdp_per_capita_usd
    valid_min: 1
    aggregation:
      method: ratio
      numerator: NY.GDP.MKTP.CD
      denominator: SP.POP.TOTL
  - code: SP.DYN.LE00.IN
    short_name: life_expectancy_years
    # Bounds catch impossible values, not extreme ones: crisis years go below 20
    # (Central African Republic 2022 is 18.8 in WDI; Rwanda 1994 was in the low teens).
    valid_min: 10
    valid_max: 100
    aggregation:
      method: weighted_mean
      weight: SP.POP.TOTL

paths:
  landing_dir: data/landing
  warehouse: data/warehouse.duckdb
  sql_dir: sql
  output_dir: output

quality:
  checks_file: config/dq_checks.yaml
  # GDP / population vs GDP per capita: relative difference above tolerance is a WARN.
  # Remove this block if any of the three indicators is not configured.
  gdp_per_capita:
    gdp: NY.GDP.MKTP.CD
    population: SP.POP.TOTL
    gdp_per_capita: NY.GDP.PCAP.CD
    tolerance: 0.01
  # WARN when the World Bank's lastupdated date is older than this at fetch time
  max_source_age_days: 400
